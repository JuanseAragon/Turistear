# Configuración para tests: base H2 en memoria y ddl-auto create-drop.
# Permite arrancar el contexto de Spring sin tocar Supabase.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

jwt.secret=turistear-super-secret-key-for-jwt-signing-2024-must-be-256-bits-long
jwt.expiration=86400000
jwt.refresh-expiration=604800000
jwt.refresh-grace-period=60000
