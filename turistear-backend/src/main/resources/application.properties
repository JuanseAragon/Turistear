spring.application.name=turistear-backend

# =====================
# Base de datos - Supabase PostgreSQL
# =====================
spring.datasource.url=jdbc:postgresql://aws-0-us-west-2.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
spring.datasource.username=postgres.qwkqhlpwwpjjqcbztbcl
spring.datasource.password=Turistear123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=4

# =====================
# JPA / Hibernate
# =====================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =====================
# JWT
# =====================
jwt.secret=turistear-super-secret-key-for-jwt-signing-2024-must-be-256-bits-long
# Access token: corta duración (15 min). Cada request lo valida el filtro sin tocar la base.
jwt.expiration=900000
# Refresh token: larga duración (7 días). Es opaco y se persiste en la tabla refresh_tokens.
jwt.refresh-expiration=604800000

# =====================
# Servidor
# =====================
server.port=8080

# =====================
# Swagger / OpenAPI
# =====================
openai.api.key=tu-clave-openai

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
